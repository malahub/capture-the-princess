server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Godot ships a 38 MB wasm; compress everything text-ish.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm application/octet-stream image/svg+xml;

    # wasm must not be sniffed, and must be allowed to stream-compile
    types {
        application/wasm wasm;
    }
    default_type application/octet-stream;

    # the shell and the pack change every deploy; the wasm does not
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /index.pck  { add_header Cache-Control "no-store"; }
    location = /index.js   { add_header Cache-Control "no-store"; }
    location ~* \.(wasm|png|jpg|svg|ico)$ { add_header Cache-Control "public, max-age=604800"; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # health probe for the platform
    location = /health { access_log off; return 200 "ok\n"; }
}
