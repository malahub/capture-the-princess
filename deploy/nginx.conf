server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep nginx's inherited mime.types (html, js, png…) — do NOT replace the
    # types map, or index.html and index.js get served as octet-stream and the
    # browser refuses to run the Godot loader.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;

    # wasm is not in mime.types on this image; give it its own location so the
    # type is set without touching the global map
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # the shell and the pack change every deploy; the wasm does not
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /index.pck  { add_header Cache-Control "no-store"; }
    location = /index.js   { add_header Cache-Control "no-store"; }
    location ~* \.(png|jpg|svg|ico)$ { add_header Cache-Control "public, max-age=604800"; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health { access_log off; return 200 "ok\n"; }
}
